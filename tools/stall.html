<!doctype html>
<html><head><meta charset="utf-8"><title>stall test</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Ekran karti / tarayici kaynakli periyodik takilma testi: oyundan bagimsiz, sade WebGL2.
const q = new URLSearchParams(location.search);
const secs = Number(q.get('s') || 30), tag = q.get('tag') || 'stall', load = Number(q.get('load') || 200);
const c = document.getElementById('c');
c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
const gl = c.getContext('webgl2', { powerPreference: 'high-performance' });
const ext = gl.getExtension('WEBGL_debug_renderer_info');
const gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
const vs = `#version 300 es
in vec2 p; out vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0, 1); }`;
const fs = `#version 300 es
precision highp float; in vec2 uv; uniform float t; out vec4 o;
void main(){ vec3 a = vec3(uv, 0.); for (int i = 0; i < ${load}; i++) a = fract(a * 1.013 + vec3(sin(t + float(i)), 0.1, 0.2)); o = vec4(a * 0.4, 1); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't');
let t0 = 0, last = 0; const frames = [], spikes = [];
function f(now) {
  if (!t0) { t0 = now; last = now; }
  const dt = now - last; last = now; const el = (now - t0) / 1000;
  if (el > 0.5) { frames.push(dt); if (dt > 40) spikes.push({ t: +el.toFixed(2), ms: +dt.toFixed(1) }); }
  gl.uniform1f(ut, el); gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (el < secs) { requestAnimationFrame(f); return; }
  const s = frames.slice().sort((x, y) => x - y);
  const rep = { gpu, w: c.width, h: c.height, fps: +(1000 / (s.reduce((a, x) => a + x, 0) / s.length)).toFixed(1), p99: s[Math.floor(s.length * 0.99)], max: s[s.length - 1], spikes };
  fetch('/__report?name=bench_' + tag, { method: 'POST', body: JSON.stringify(rep) });
}
requestAnimationFrame(f);
</script></body></html>
